name: Wheel install

# Build the wheel, install it into a clean virtualenv, and use it from there.
#
# This is the boundary the rest of CI cannot cross. Every other job installs the package with
# `pip install -e .`, which puts the *checkout* on sys.path: every file in the repository is
# importable and openable whether or not the wheel carries it. That is why
# `[tool.setuptools.package-data]` could ship the env files and not src/metawrap2/data/, and
# `pathways` and `quantify_function` could raise FileNotFoundError on
# site-packages/metawrap2/data/kegg/modules_table.tsv for every user who installed the way the
# README's first line says, while 178 unit tests passed and the CLI smoke test passed with them.
#
# Nothing here needs conda, a database, or more than a minute of CPU, so it runs on every push -
# a packaging defect is cheapest to find in the pull request that introduces it.

on:
  push:
  pull_request:

jobs:
  wheel:
    name: Build, install, and run from a wheel (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two ends of the supported range rather than all five: a missing package-data
        # pattern is the same on every interpreter, but a dependency with no wheel for the
        # newest Python - or a floor that no longer builds on the oldest - is not.
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          python -c "
          import zipfile, glob
          names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()
          print('\n'.join(n for n in sorted(names) if not n.endswith('.py')))
          "

      # A separate interpreter with nothing but the wheel in it. Installed from an absolute path
      # and used from outside the checkout, so nothing can be satisfied by a repository file that
      # the wheel does not contain.
      - name: Install it into a clean virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/clean/bin/pip" install "$(ls "$PWD"/dist/*.whl)"
          # Modules here run tools off PATH; none of the invocations below needs a real tool, but
          # without this they stop at "mamba is not on PATH" instead of doing anything.
          printf '[settings]\nuse_conda_envs = false\n' > "$RUNNER_TEMP/metawrap2.toml"

      # The failure the user reported, asserted directly: the data directory is in the install
      # tree, the module table loads out of it, and it is the installed copy being read and not a
      # file left over in the checkout.
      - name: The packaged data files are in site-packages
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/clean/bin/python" - <<'PY'
          import os

          import metawrap2
          from metawrap2 import kegg

          # Resolved, and checked for "site-packages" rather than against sysconfig's purelib:
          # a venv on some distributions installs into lib64 and reports lib, and this check
          # failing over that would say "testing the checkout" about a perfectly good wheel.
          installed = os.path.realpath(os.path.dirname(metawrap2.__file__))
          table = os.path.realpath(kegg.MODULES_TABLE)
          assert "site-packages" in installed, (
              "metawrap2 was imported from %s, which is not an installed copy - this check is "
              "testing the checkout, not the wheel" % installed
          )
          assert table.startswith(installed), "%s is outside the install at %s" % (table, installed)
          modules = kegg.load_modules()
          assert len(modules) > 500, "only %d KEGG modules loaded" % len(modules)
          print("%d KEGG modules from %s" % (len(modules), table))
          for root, _dirs, files in os.walk(os.path.join(installed, "data")):
              for name in sorted(files):
                  print("packaged:", os.path.relpath(os.path.join(root, name), installed))
          PY

      # Pfam's release is read out of relnotes.txt beside whatever PFAM_DB names - which is the
      # HMM file, because that is what `install-db pfam` records. Checked here as well as in the
      # unit tests because the full `annotate --pfam` path needs the 399 MB database, and this is
      # the part of it that silently returned "unknown" on every run.
      - name: Pfam provenance survives the install
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/clean/bin/python" - <<'PY'
          import os
          import tempfile

          from metawrap2 import pfam

          with tempfile.TemporaryDirectory() as db:
              open(os.path.join(db, "Pfam-A.hmm"), "w").write("HMMER3/f [3.4]\n")
              open(os.path.join(db, "relnotes.txt"), "w").write("notes\n     RELEASE 38.2\n")
              for shape in (db, os.path.join(db, "Pfam-A.hmm"), os.path.join(db, "relnotes.txt")):
                  found = pfam.release_from_notes(shape)
                  assert found == "38.2", "%s -> %s" % (shape, found)
          print("Pfam release read from all three path shapes")
          PY

      # Enumerated from the installed CLI's own tables, so a module added tomorrow is covered
      # without touching this file - and a module whose import breaks only in an installed
      # layout (a data file, a missing dependency) fails here.
      - name: Every module and utility prints its help
        run: |
          export METAWRAP2_CONFIG="$RUNNER_TEMP/metawrap2.toml"
          mw2="$RUNNER_TEMP/clean/bin/metawrap2"
          "$mw2" --version
          "$mw2" --help > /dev/null
          names=$("$RUNNER_TEMP/clean/bin/python" -c "import metawrap2.cli as c; print(' '.join(list(c.MODULES) + list(c.UTILITIES)))")
          echo "Checking: $names"
          for name in $names; do
            echo "--- $name --help"
            "$mw2" "$name" --help > /dev/null
          done

      # One real invocation, not a help text: `pathways` is one of the two modules the missing
      # package-data broke, and it is the module that reads the vendored KEGG table on its first
      # line of work. The KO table is written here rather than committed because ten curated
      # glycolysis KOs are enough to score modules, and the point is the code path.
      - name: A module that reads the packaged data actually runs
        run: |
          export METAWRAP2_CONFIG="$RUNNER_TEMP/metawrap2.toml"
          work="$RUNNER_TEMP/pathways"
          mkdir -p "$work"
          {
            printf 'genome\tgene_id\tko\tscore\tthreshold\tevalue\tevidence\tf_measure\t'
            printf 'definition\tthreshold_policy\tko_list_snapshot\n'
            for ko in K00844 K12407 K00845 K01810 K00850 K01803 K00134 K00927 K01689 K00873; do
              printf 'binA\tgene_%s\t%s\t200.0\t100.0\t1e-40\tcurated\t0.98\t-\tcurated\tci\n' "$ko" "$ko"
            done
          } > "$work/kos.tsv"
          # --skip-krona: Krona draws the pictures and lives in a conda env; the completeness
          # table is the number, and it comes from the packaged module definitions.
          "$RUNNER_TEMP/clean/bin/metawrap2" pathways -k "$work/kos.tsv" -o "$work/out" --skip-krona
          test -s "$work/out/modules.tsv"
          head -n 3 "$work/out/modules.tsv"

      # The committed fixture, through the whole-study driver. A dry run on purpose in this job:
      # it builds and validates every module command for a real pair of read files without any
      # tool installed, which is what catches a module whose arguments the driver gets wrong. The
      # run that executes those commands is .github/workflows/end-to-end.yml.
      - name: The run driver plans a study on the tiny fixture
        run: |
          export METAWRAP2_CONFIG="$RUNNER_TEMP/metawrap2.toml"
          "$RUNNER_TEMP/clean/bin/metawrap2" run "$PWD/benchmarks/fixtures/tiny/reads" \
            -o "$RUNNER_TEMP/study" --dry-run | tee "$RUNNER_TEMP/plan.txt"
          grep -q "STUDY COMPLETE" "$RUNNER_TEMP/plan.txt"

      - name: Say what a failure here means
        if: failure()
        run: |
          echo "::error::The wheel does not work even though the editable install does. Look"\
               "first at [tool.setuptools.package-data] in pyproject.toml: a file that is in the"\
               "repository and not in the wheel is this job's most common finding, and"\
               "tests/test_packaging_data.py should have caught it before here."
