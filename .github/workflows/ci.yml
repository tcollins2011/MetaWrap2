name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov

      # Gating, not advisory: the codebase is clean, so any new finding is a real regression.
      # If a rule genuinely does not suit the project, silence it in pyproject.toml's
      # [tool.ruff.lint] with a comment saying why - do not put "|| true" back here.
      - name: Lint (ruff)
        run: ruff check .

      # Formatting is checked, never applied, in CI: a job that rewrites your code and then
      # passes teaches you nothing. Run `black . && isort .` locally (or let the pre-commit
      # hook do it) and commit the result.
      - name: Format check (black)
        run: black --check --diff .

      - name: Import order (isort)
        run: isort --check-only --diff .

      - name: Type check (mypy)
        run: mypy

      - name: Unit tests (pytest + coverage)
        run: python -m pytest -q --cov=metawrap2 --cov-report=term-missing

      - name: Byte-compile the metawrap2 package
        run: python -m compileall -q src/metawrap2

      # Every module must be able to print its own help and plan a whole run without any
      # external tool installed. This is what catches wiring mistakes (a bad command
      # template, a missing argument) that unit tests cannot see.
      - name: Smoke-test the CLI
        run: |
          metawrap2 --version
          metawrap2 --help
          for module in read_qc assembly kraken2 blobology binning bin_refinement \
                        reassemble_bins quant_bins classify_bins annotate_bins; do
            echo "--- $module --help"
            metawrap2 "$module" --help > /dev/null
          done
          for util in quickstart check doctor install-env install-db history status calibrate \
                      run test config completion; do
            echo "--- $util --help"
            metawrap2 "$util" --help > /dev/null || true
          done

  no-legacy-scripts:
    name: No shell/perl/R scripts in repo
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fail if any .sh/.pl/.R files exist
        run: |
          if find . -path ./.git -prune -o \( -name '*.sh' -o -name '*.pl' -o -name '*.R' \) -print | grep .; then
            echo "MetaWrap2 is Python-only: remove the .sh/.pl/.R files listed above." >&2
            exit 1
          fi
