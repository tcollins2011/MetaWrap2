name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov

      # Gating: the codebase is clean, so any new finding is a regression. If a rule does not
      # suit the project, ignore it in pyproject.toml's [tool.ruff.lint] with a comment saying
      # why; do not add "|| true" here.
      - name: Lint (ruff)
        run: ruff check .

      # Formatting is checked, not applied, in CI. Run `black . && isort .` locally (or let the
      # pre-commit hook do it) and commit the result.
      - name: Format check (black)
        run: black --check --diff .

      - name: Import order (isort)
        run: isort --check-only --diff .

      - name: Type check (mypy)
        run: mypy

      # No METAWRAP2_CONFIG here: tests/conftest.py pins use_conda_envs per test, so the suite does
      # not depend on the machine's config. (Writing one here once let the suite pass in CI and fail
      # on a developer's machine.)
      # Uses the same small-machine wrapper as the pre-push hook, so a push that passed locally does
      # not fail here because the runner has fewer cores or less disk.
      - name: Unit tests (pytest + coverage)
        run: python tests/run_on_small_machine.py -q --cov=metawrap2 --cov-report=term-missing

      - name: Byte-compile the metawrap2 package
        run: python -m compileall -q src/metawrap2

      # Every module must print its help and plan a whole run with no external tool installed.
      # This catches wiring mistakes (a bad command template, a missing argument) that unit tests
      # do not.
      - name: Smoke-test the CLI
        run: |
          metawrap2 --version
          metawrap2 --help
          # Module names come from the CLI's tables, so new modules are tested automatically.
          modules=$(python -c "import metawrap2.cli as c; print(' '.join(c.MODULES))")
          utilities=$(python -c "import metawrap2.cli as c; print(' '.join(c.UTILITIES))")
          for module in $modules; do
            echo "--- $module --help"
            metawrap2 "$module" --help > /dev/null
          done
          for util in $utilities; do
            echo "--- $util --help"
            metawrap2 "$util" --help > /dev/null
          done

  no-legacy-scripts:
    name: No shell/perl/R scripts in repo
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fail if any .sh/.pl/.R files exist
        run: |
          if find . -path ./.git -prune -o \( -name '*.sh' -o -name '*.pl' -o -name '*.R' \) -print | grep .; then
            echo "MetaWrap2 is Python-only: remove the .sh/.pl/.R files listed above." >&2
            exit 1
          fi
