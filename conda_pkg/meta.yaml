package:
  name: metawrap2
  version: "2.0.0"

source:
  git_url: https://github.com/ursky/MetaWrap2.git

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"
  entry_points:
    - metawrap2 = metawrap2.cli:main

# The core package is lightweight: it only needs python3 + biopython (and tomli
# on Python <3.11 for config parsing). The heavy per-module tools (spades,
# checkm, salmon, kraken2, ...) live in their own per-module conda environments
# under envs/ so each one resolves independently instead of in a single shared
# environment. See envs/README.md.
requirements:
  host:
    - python >=3.8
    - pip
    - setuptools >=61
  run:
    - python >=3.8
    - biopython >=1.79
    - tomli  # [py<311]

about:
  home: https://github.com/ursky/MetaWrap2
  summary: "MetaWrap2 - Python-native successor to metaWRAP for metagenomic data analysis."
  license: MIT
  license_file: LICENSE
