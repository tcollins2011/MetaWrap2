package:
  name: metawrap2
  version: "2.0.1"

source:
  git_url: https://github.com/ursky/MetaWrap2.git

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"
  entry_points:
    - metawrap2 = metawrap2.cli:main

# The core package is light: python, biopython, and the plotting/table stack the bundled
# helper scripts use (they run in the host interpreter, so these are hard requirements, not
# extras - keep this list in step with [project].dependencies in pyproject.toml). The heavy
# per-module tools (spades, checkm, salmon, kraken2, ...) live in their own per-module conda
# environments under src/metawrap2/envs/ so each resolves independently instead of in one
# shared environment. See src/metawrap2/envs/README.md.
requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=61
  run:
    - python >=3.10
    - biopython >=1.79
    - numpy >=1.20
    - pandas >=1.3
    - matplotlib-base >=3.5
    - seaborn >=0.11
    - scipy >=1.7
    - tqdm >=4.60
    - tomli  # [py<311]

about:
  home: https://github.com/ursky/MetaWrap2
  summary: "MetaWrap2 - Python-native successor to metaWRAP for metagenomic data analysis."
  license: MIT
  license_file: LICENSE
