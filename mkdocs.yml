site_name: MetaWrap2
site_description: A flexible, Python-native pipeline for genome-resolved metagenomic data analysis
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
    - scheme: slate
      primary: teal
nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Modules: modules.md
  - Provenance & reproducibility: provenance.md
  - Contributing: contributing.md
markdown_extensions:
  - admonition
  - tables
  - fenced_code
