site_name: MetaWrap2
site_description: MetaWrap2, a benchmarked pipeline for genome-resolved metagenomics, from reads to MAGs and their functions
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
    - scheme: slate
      primary: teal
nav:
  - Home: index.md
  - Installation: installation.md
  - Tutorial: tutorial.md
  - Usage: usage.md
  - Modules: modules.md
  - Scoring genomes: score.md
  - Benchmarks: benchmarks.md
  - Release notes: https://github.com/ursky/MetaWrap2/tree/main/releases
  - Provenance & reproducibility: provenance.md
  - Contributing: contributing.md
markdown_extensions:
  - admonition
  - tables
  - fenced_code
