# MetaWrap2 benchmark datasets.
#
# Each dataset lists its URL, checksum, exact download size and gold-standard location together.
#
# Every `bytes` value was measured with a HEAD request against the host. `metawrap2 benchmark
# fetch` compares the total against the [limits] disk ceiling and refuses to start when there is
# no room. Sizes also catch a truncated download before it is hashed.
#
# `md5` values are copied from the publisher's `md5sums.tsv` (fetchable at
# `<base_url><checksum_manifest>`). They are pinned here instead of read at fetch time, so a later
# re-fetch is verified against the bytes this benchmark was built on, and a re-publication
# upstream shows up as a checksum failure.

schema = 1

# Known gap. Every arm in benchmarks/configurations.toml runs on simulated CAMI2 reads, which are
# uniformly high quality, while fastp and trim-galore differ mainly on low-quality data. On 75 bp
# reads from around 2010 (MetaHIT ERR011347-9), fastp's defaults discarded 58.5% of one library
# while trim-galore trimmed and kept 95%, which changed nonpareil's effort projection five-fold.
# Registering a low-quality dataset here would let `benchmark run <dataset> trimmer` measure this;
# until then `read_qc` reports retention and warns below 70%.

# --------------------------------------------------------------------------------------------
# CAMI2's human gastrointestinal body site: ten samples of simulated short reads with a known
# ground truth, for measuring binning correctness independently of CheckM.
# --------------------------------------------------------------------------------------------
[cami2_gi]
title = "CAMI2 human microbiome challenge - gastrointestinal, short read"
description = """\
Ten simulated Illumina samples from the CAMI2 human gastrointestinal body site, with a per-contig \
gold standard mapping every contig to the genome it came from. Because the truth is known, this \
measures whether a bin is right, not just whether CheckM thinks it is complete."""
citation = "Meyer F, et al. Critical Assessment of Metagenome Interpretation - the second round of challenges. Nat Methods 19:429-440 (2022)."
doi = "10.4126/FRL01-006425518"
license = "CC BY 4.0"
base_url = "https://frl.publisso.de/data/frl:6425518/"
checksum = "md5"
checksum_manifest = "md5sums.tsv"

# The published dataset interleaves gastrointestinal and oral samples in one directory; these ten
# are the gastrointestinal ones, per the dataset's README. One body site keeps the benchmark to a
# manageable size.
samples = [0, 1, 2, 3, 4, 5, 9, 10, 11, 12]

# About 95% of each 10 GB archive is per-OTU BAM alignments that a binning benchmark does not
# read. Keeping only these members does not shrink the download (the archive is a single gzip
# stream), but it keeps the extracted footprint to the reads and contigs: a few GB instead of
# 100 GB.
keep = [
    "*/reads/*",
    "*/contigs/*",
    "*/*.tsv",
    "*/*.tsv.gz",
    "*/*.yaml",
]

# The reads are interleaved pairs, one FASTQ per sample. read_qc needs them split, so the harness
# deinterleaves them; this declares the layout.
#
# The glob names the file, not the directory, because reads/ also contains a 3 MB subsample_0.fq
# debugging extract under the same sample_N directory, with the same sample label. A
# directory-wide match would find both. The archives ship it uncompressed; the trailing wildcard
# keeps a re-published .fq.gz matching.
reads_glob = "*/reads/anonymous_reads.fq*"
reads_layout = "interleaved"

# Which genome every read came from, one file per sample: the truth for how abundant each
# organism was. The gold_standard binning file maps contigs to genomes and carries no abundance.
# Quantifier comparisons score against this; the keep list above retains it.
abundance_truth_glob = "*/reads/reads_mapping.tsv.gz"

# Peak disk is bounded by the download: each archive is deleted once extracted. Deinterleaving
# into mate files happens later, under the benchmark's work directory, and roughly doubles the
# reads; budget for that separately. No multiplier is applied here, since the measured size is an
# upper bound.
disk_note = "peak disk is bounded by the download; archives are removed as they are extracted"

