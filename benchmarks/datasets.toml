# MetaWrap2 benchmark datasets.
#
# This file is data, not code, so that adding a dataset is a change a reviewer can read in one
# sitting: the URL, the checksum, the exact size on the wire, and where the gold standard lives,
# all next to each other.
#
# Every `bytes` value here was measured with a HEAD request against the host, not estimated.
# That is the point of recording it: `metawrap2 benchmark fetch` compares the total against the
# [limits] disk ceiling and refuses to start when there is no room, instead of filling the
# filesystem and finding out at 80 GB. Sizes are also the cheap half of verification - a
# truncated download is caught by its length before anything spends minutes hashing it.
#
# `md5` values are copied from the publisher's own `md5sums.tsv`, which is itself fetchable at
# `<base_url><checksum_manifest>`. They are pinned here rather than read from that file at fetch
# time on purpose: pinned, a re-fetch in two years verifies against the bytes this benchmark was
# actually built on, and a silent re-publication upstream shows up as a checksum failure rather
# than as quietly different results.

schema = 1

# --------------------------------------------------------------------------------------------
# The real benchmark: CAMI2's human gastrointestinal body site. Ten samples of simulated short
# reads with a known ground truth, which is the only way to measure binning *correctness* rather
# than CheckM's opinion of it.
# --------------------------------------------------------------------------------------------
[cami2_gi]
title = "CAMI2 human microbiome challenge - gastrointestinal, short read"
description = """\
Ten simulated Illumina samples from the CAMI2 human gastrointestinal body site, with a per-contig \
gold standard mapping every contig to the genome it came from. Because the truth is known, this \
measures whether a bin is right, not just whether CheckM thinks it is complete."""
citation = "Meyer F, et al. Critical Assessment of Metagenome Interpretation - the second round of challenges. Nat Methods 19:429-440 (2022)."
doi = "10.4126/FRL01-006425518"
license = "CC BY 4.0"
base_url = "https://frl.publisso.de/data/frl:6425518/"
checksum = "md5"
checksum_manifest = "md5sums.tsv"

# The published dataset interleaves gastrointestinal and oral samples in one directory; these ten
# are the gastrointestinal ones, per the dataset's own README. Taking a subset of body sites is
# deliberate - one body site is a benchmark, all of them is a cluster job.
samples = [0, 1, 2, 3, 4, 5, 9, 10, 11, 12]

# Roughly 95% of each 10 GB archive is per-OTU BAM alignments that a binning benchmark never
# reads. Keeping only these members does not shrink the download - the archive is a single gzip
# stream, so there is no way to fetch part of it - but it keeps the extracted footprint to the
# reads and contigs, which is the difference between 100 GB on disk and a few GB.
keep = [
    "*/reads/*",
    "*/contigs/*",
    "*/*.tsv",
    "*/*.tsv.gz",
    "*/*.yaml",
]

# The reads are interleaved pairs in one FASTQ per sample. read_qc needs them split, so the
# harness deinterleaves on the way in; declaring the shape here is what tells it to.
#
# The glob names the file rather than the directory because reads/ also contains a 3 MB
# subsample_0.fq debugging extract, which sits under the same sample_N directory and therefore
# carries the same sample label. A directory-wide match finds both, and the small one wins - a
# trimmer benchmarked on 3 MB of a 10 GB sample. The archives ship it uncompressed, so the
# trailing wildcard is there only to keep a re-published .fq.gz matching.
reads_glob = "*/reads/anonymous_reads.fq*"
reads_layout = "interleaved"

# Which genome every read came from, one file per sample, which is the only truth that can say how
# much of a sample an organism actually was. The gold_standard binning file cannot: it maps contigs
# to genomes, and a contig carries no abundance. Quantifier comparisons score against this; the
# keep list above already retains it.
abundance_truth_glob = "*/reads/reads_mapping.tsv.gz"

# Peak disk is bounded by the download itself: each archive is deleted once extracted, so what
# lands can never exceed what arrived. Deinterleaving into mate files happens later, under the
# benchmark's own work directory, and roughly doubles the reads - budget for that separately. No
# multiplier is applied here because a measured upper bound beats an invented one.
disk_note = "peak disk is bounded by the download; archives are removed as they are extracted"

