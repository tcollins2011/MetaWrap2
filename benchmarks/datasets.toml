# --------------------------------------------------------------------------------------------
# The fixture: a few hundred contigs from three synthetic genomes, committed to the repository,
# so the harness (fetch plan, scorers, TSV schema, time-to-performance arithmetic) can be tested
# in CI without a 100 GB download.
# --------------------------------------------------------------------------------------------
[tiny]
title = "Tiny synthetic fixture (committed, no download)"
description = """\
Three synthetic genomes shredded into a few hundred contigs, with a gold standard mapping. Far \
too small to say anything about a binner's accuracy; large enough to prove the harness computes \
and records the numbers it claims to."""
local = "fixtures/tiny"
reads_glob = "reads/*.fq.gz"
reads_layout = "paired"

[[tiny.files]]
sample = 1
path = "reads/sample_1_1.fq.gz"

[[tiny.files]]
sample = 1
path = "reads/sample_1_2.fq.gz"

[[tiny.gold_standard]]
role = "assembly"
path = "assembly.fa"

[[tiny.gold_standard]]
role = "binning"
path = "gold_standard_binning.tsv"
