# --------------------------------------------------------------------------------------------
# The third body site (skin). Same deposit and truth format. Gastrointestinal and oral are both
# high-diversity communities, while skin is low-diversity and dominated by a few genera, so this
# tests defaults across community structure.
#
# The deposit does not say which of its 29 airskinurogenital samples are skin. This was
# established by overlap with the published per-body-site gold standards: of each sample's
# genomes, 88 of 90, 50 of 52 and 238 of 240 are in skin's, against roughly half that in airways'
# and almost none in urogenital's.
#
# The three sites are interleaved in the deposit, not in blocks. Each sample was assigned by overlap
# with the three per-site gold standards and checked against the deposit's setup.tar.gz abundance
# files:
#
#   skin (10):        1, 13, 14, 15, 16, 17, 18, 19, 20, 28
#   airways (10):     4, 7, 8, 9, 10, 11, 12, 23, 26, 27
#   urogenital (9):   0, 2, 3, 5, 6, 21, 22, 24, 25
#
# These match CAMI2's nominal 10/10/9, and each group's union reproduces its pooled gold standard
# (airways 828 of 828, skin 609 of 609, urogenital 246 of 248). Samples 10-12 look like skin by
# position but are airways.
# --------------------------------------------------------------------------------------------
[cami2_skin]
title = "CAMI2 human microbiome challenge - skin, short read"
description = """\
Three simulated Illumina samples from the CAMI2 skin body site, with the same per-contig gold \
standard as the gastrointestinal and oral sets. Lower diversity than either, which is the point: \
it tests a default against a different community shape rather than a second gut."""
citation = "Meyer F, et al. Critical Assessment of Metagenome Interpretation - the second round of challenges. Nat Methods 19:429-440 (2022)."
doi = "10.4126/FRL01-006425518"
license = "CC BY 4.0"
base_url = "https://frl.publisso.de/data/frl:6425518/"
checksum = "md5"
checksum_manifest = "md5sums.tsv"

# Verified after extraction, not taken from the numbering; see the comment above.
samples = [17, 18, 19]

keep = [
    "*/reads/*",
    "*/contigs/*",
    "*/*.tsv",
    "*/*.tsv.gz",
    "*/*.yaml",
]

reads_glob = "*/reads/anonymous_reads.fq*"
reads_layout = "interleaved"
abundance_truth_glob = "*/reads/reads_mapping.tsv.gz"
disk_note = "peak disk is bounded by the download; archives are removed as they are extracted"

