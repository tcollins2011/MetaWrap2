# Bin refinement module tools (metawrap2 bin_refinement), default CheckM1 path.
# CheckM1 still needs pplacer, which is memory-hungry on large trees; if the
# env is hard to solve or the RAM cost is a problem, use
# bin_refinement-checkm2.yaml instead and pass the module's --checkm2 option.
name: metawrap2-bin_refinement
channels:
  - conda-forge
  - bioconda
dependencies:
  # CheckM1 imports pkg_resources, which setuptools removed in 81. Without this pin the
  # solver happily installs a setuptools that makes `checkm` fail on import.
  - python <3.12
  - setuptools <81
  - checkm-genome >=1.2.0
  - pplacer
