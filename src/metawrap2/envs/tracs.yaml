# TRACS, the second strain backend.
#
# A separate env, as for RGI: it resolves an older scientific-python stack than inStrain's env,
# and one env would downgrade the default backend.
#
# The two backends answer different questions. inStrain compares allele populations and reports a
# population identity; TRACS estimates a transmission distance from a consensus SNP distance after
# accounting for within-host diversity and a clock. Shaw & Yu's evaluation found most tools
# overestimate SNP distances and TRACS the least. The two are run side by side and reported
# separately, not averaged.
#
# TRACS also needs a sourmash signature database of the reference genomes, which `strains` builds
# per run, since a stale one would screen against the wrong references without failing.
name: metawrap2-tracs
channels:
  - conda-forge
  - bioconda
dependencies:
  - tracs >=1.0
