# Read- and bin-level taxonomy: kraken2 with its Krona plot, and the taxator-tk classifier.
#
# GTDB-Tk has no common solution with taxator-tk, and it needs a 100+ GB reference database, so
# it is opt-in in its own env. See gtdbtk.yaml.
name: metawrap2-taxonomy
channels:
  - conda-forge
  - bioconda
dependencies:
  - kraken2 >=2.1.2
  # Next to kraken2 because it completes it: kraken2 reports reads assigned at each node, and a
  # read matching sequence conserved across a genus is assigned to the genus, so the species rows of
  # a report are not a composition. Bracken redistributes those reads down to one rank using the
  # k-mer distribution of the kraken2 database.
  #
  # The package is 507 kB and depends on kraken2. It needs a database: `bracken-build` writes
  # databaseNmers.kmer_distrib into the kraken2 database directory, per read length, and it is valid
  # only for the kraken2 database it was built from.
  #
  # bioconda's bracken 3.1 ships a wrapper whose VERSION string says 3.0.1, so `bracken -v` and the
  # package version disagree. The pin is on the package.
  - bracken >=3.0
  - krona >=2.8
  - taxator-tk >=1.3.3e
  - blast >=2.13
