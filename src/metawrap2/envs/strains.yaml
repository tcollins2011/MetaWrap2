# Within-population variation: inStrain, plus the aligners that feed it.
#
# A separate env because inStrain resolves to Python 3.8, which nothing else here can use. For the
# same reason strains is its own module instead of a flag on another one.
#
# The aligners are included because the module maps every sample itself against one genome set:
# popANI between samples mapped to different references is not comparable. The same three
# aligners as the rest of the pipeline, so `--aligner` means the same as in `binning`.
name: metawrap2-strains
channels:
  - conda-forge
  - bioconda
dependencies:
  - instrain >=1.9
  - minimap2 >=2.24
  - bwa-mem2 >=2.2
  - samtools >=1.15
