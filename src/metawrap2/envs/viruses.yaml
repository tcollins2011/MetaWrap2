# Viral contigs: geNomad to find them, CheckV to say how complete they are.
#
# The viral counterpart of binning plus CheckM2: geNomad identifies viruses, CheckV estimates how
# complete each one is (for example 40% of a genome).
#
# geNomad classifies a contig as viral, plasmid or chromosomal in one pass against one database,
# so the `amr` module's mobility analysis shares this download and no second plasmid tool is
# needed.
#
# CheckV trims host flanks off proviruses, so an integrated prophage is reported as a virus plus a
# piece of bacterial chromosome instead of one chimeric contig.
#
# VIBRANT and VirSorter2 are not included: both are behind geNomad and less actively maintained.
name: metawrap2-viruses
channels:
  - conda-forge
  - bioconda
dependencies:
  # geNomad imports numba, whose numpy compatibility is narrow: an env built without this pin raised
  # "Numba needs NumPy 1.26 or less" on `genomad --version`.
  #
  # The same error can come from outside the env: `~/.local/lib/python3.12/site-packages` precedes
  # a conda env on sys.path, so a user-installed numpy shadows this pin. MetaWrap2 sets
  # PYTHONNOUSERSITE=1 for every env-wrapped command (see command.Runner._child_env); a bare
  # `mamba run` does not.
  - numpy <1.27
  - genomad >=1.8
  - checkv >=1.0.3
  # CRISPR arrays from the prokaryotic bins, for host prediction (`viruses --crispr-hosts`). A
  # spacer is a record of past infection, so a match in a viral contig is direct evidence of a
  # host.
  - cctyper >=1.8
  # Required by the numpy pin above: pandas 3 is built against numpy 2, and conda will install that
  # build next to numpy 1.26, after which cctyper fails on `import pandas`.
  #
  # If cctyper fails here with "Could not find HMM profile database": bioconda's build ships an
  # activation script exporting CCTYPER_DB=$CONDA_PREFIX/cct_data, a 1.8-era data directory without
  # 1.9's profiles. MetaWrap2 passes --db pointing at the data inside the Python package; a bare
  # `cctyper` does not.
  - pandas <3
