# Optional GTDB-Tk environment for bin classification
# (metawrap2 classify_bins --gtdbtk). Opt-in modern classifier; the default
# stays taxator-tk in classify_bins.yaml. Needs the GTDB reference data
# downloaded separately.
#
# Pinned to a major-minor range instead of open above 2.4. `>=2.4.0` now resolves to 2.7.x,
# which needs reference release R232 and about 140 GB of RAM for classify_wf, and has dropped
# flags earlier versions accepted. Before moving this pin, check the flags in
# classify_bins.COMMANDS against the new release and state which R the data must be.
name: metawrap2-gtdbtk
channels:
  - conda-forge
  - bioconda
dependencies:
  # GTDB-Tk 2.4.x needs pydantic 1.x, whose models get no fields on Python 3.15 (3.12 works).
  - python >=3.9,<3.13
  # GTDB-Tk 2.4.x calls ndarray.tostring(), removed in numpy 2.0; classify_wf fails after markers.
  - numpy <2
  - gtdbtk >=2.4.0,<2.5.0
