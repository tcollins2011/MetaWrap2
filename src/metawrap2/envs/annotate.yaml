# Gene calling and annotation: Prokka (default) and Bakta.
#
# One env: they do the same job and solve together, so --bakta needs no second install.
name: metawrap2-annotate
channels:
  - conda-forge
  - bioconda
dependencies:
  - prokka >=1.14
  - bakta >=1.9
  # CAZyme families (`annotate --cazy`). Here because it reads the proteins this module has
  # already called; if dbCAN called its own genes, the two gene sets could not be joined. It solves
  # with prokka and bakta unchanged; its 7.4 GB database is a separate download
  # (`metawrap2 install-db dbcan`).
  - dbcan >=5.2
  # Biosynthetic gene clusters (`annotate --bgc`). GECCO instead of antiSMASH: a CRF over Pyrodigal
  # genes and PyHMMER domains (both already used in-process), no database, and minutes per genome
  # against antiSMASH's tens of minutes and ~10 GB install. antiSMASH remains the tool for studying
  # individual clusters; GECCO makes counting clusters across 200 MAGs affordable.
  - gecco >=0.10
