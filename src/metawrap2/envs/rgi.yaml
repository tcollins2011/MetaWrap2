# RGI, the second resistance backend, in its own environment.
#
# Separate from metawrap2-amr because the solver forces it, as for CheckM2 and CheckM1: RGI pins
# an older dependency set than AMRFinderPlus and hAMRonization resolve to, so one env gives either
# a conflict or a downgrade of the default backend.
#
# The two backends disagree, and the disagreements are informative. RGI models resistance three
# ways (homolog, variant against a wild type, overexpression) and its calls carry CARD ARO terms.
# AMRFinderPlus curates a per-gene threshold and covers virulence and stress in the same run.
# hAMRonization puts both tables in one schema and argNorm makes the gene names comparable.
#
# CARD's data is a separate download, never fetched implicitly: `metawrap2 install-db card`. An
# ARG call depends on its database version, and CARD (4.0.2 at the time of writing) releases every
# few months.
name: metawrap2-rgi
channels:
  - conda-forge
  - bioconda
dependencies:
  - rgi >=6.0
