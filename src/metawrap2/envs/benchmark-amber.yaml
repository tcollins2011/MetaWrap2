# AMBER environment for the benchmark harness (metawrap2 benchmark score, on a binning comparison).
# AMBER scores bins against a dataset's known contig-to-genome truth. It does not use marker genes,
# so it complements CheckM: several modern binners use single-copy markers internally, and a
# marker-based score is not independent of them.
#
# A separate env, not a module's, because only `metawrap2 benchmark` uses AMBER.
name: metawrap2-benchmark-amber
channels:
  - conda-forge
  - bioconda
dependencies:
  - cami-amber >=2.0.5
  # AMBER draws its figures with `boxplot(labels=...)`, which matplotlib removed in 3.9, so a fresh
  # solve gives `Axes.boxplot() got an unexpected keyword argument 'labels'` after the metrics are
  # computed. The pin is on matplotlib, not AMBER, because only AMBER's plotting uses the old API.
  # cami-amber does not constrain matplotlib itself.
  - matplotlib-base <3.9
