# SingleM, for `metawrap2 appraise`: what share of the community a bin set represents.
#
# A separate env for two reasons. SingleM pins its own narrow set of dependencies (smafa,
# diamond, hmmer, a pinned pandas/numpy pair) with no overlap with the bins or binqc envs. And it
# needs the GTDB marker metapackage (2.2 GB to download, 9.7 GB on disk), which users who do not
# run appraise should not have to install.
#
# `metawrap2 install-db singlem` runs `singlem data` to download the metapackage. Nothing
# downloads it implicitly: the appraise module fails with the install command instead.
name: metawrap2-singlem
channels:
  - conda-forge
  - bioconda
dependencies:
  # 0.21 is the floor because this series' `microbial_fraction` output is what metawrap2.funcabund
  # parses, and its read_fraction.py is what the percentage handling there was checked against.
  - singlem >=0.21.4
