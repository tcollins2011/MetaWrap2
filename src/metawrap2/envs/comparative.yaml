# Comparative genomics over a cohort's MAGs: pangenomes and phylogenies.
#
# `pangenome` builds a species pangenome per dereplication cluster and can write its core-gene
# alignment, and `phylogeny` turns an alignment into a tree, so the two modules share an env.
#
# IQ-TREE is the default and FastTree is included. IQ-TREE's ModelFinder chooses a substitution
# model from the data and its ultrafast bootstrap gives meaningful support values on a 120-marker
# concatenation. FastTree is orders of magnitude faster, for hundreds of genomes.
#
# MAFFT is PPanGGOLiN's aligner for the core-gene MSA; it does not bundle one.
name: metawrap2-comparative
channels:
  - conda-forge
  - bioconda
dependencies:
  - ppanggolin >=2.0
  # >=3 because that installs the `iqtree` entry point this module calls; 2.x installs `iqtree2`.
  # The flags used here are the same in both.
  - iqtree >=3.0
  - fasttree >=2.1
  - mafft >=7.5
