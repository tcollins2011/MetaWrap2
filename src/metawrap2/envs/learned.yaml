# The three learned binners: SemiBin2, VAMB and COMEBin.
#
# One env instead of three. All three are pytorch applications and solve together; separate envs
# held three copies of the same 1.5 GB dependency graph. They are kept out of bins.yaml because
# pytorch is the heaviest dependency in this half of the pipeline, and metaBAT2-only users should
# not need it.
#
# The solve pulls a CUDA-capable pytorch, so this env serves both `--device cpu` and
# `--device cuda`. The default is the CPU; see DEFAULT_LEARNED_DEVICE in modules/binning.py for
# why (reproducibility).
name: metawrap2-learned
channels:
  - conda-forge
  - bioconda
dependencies:
  - semibin >=2.5.0
  - vamb >=5.0.4
  - comebin >=1.1.0
