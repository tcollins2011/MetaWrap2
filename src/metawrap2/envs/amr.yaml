# Resistance and virulence: AMRFinderPlus, plus the tools that make a second backend usable.
#
# AMRFinderPlus is the default backend: NCBI curates a per-gene threshold for every reference, it
# handles point mutations as well as acquired genes, and `--plus` emits virulence entries in the
# same schema.
#
# hAMRonization normalises the tables of different tools into one 35-field schema, and argNorm maps
# every call onto an ARO term, so a gene found by two backends is recognised as one gene.
#
# RGI is in its own env (rgi.yaml): it needs older pinned dependencies that conflict with this set,
# and CARD's data downloaded and loaded separately. The solver forces the split, as for CheckM2.
name: metawrap2-amr
channels:
  - conda-forge
  - bioconda
dependencies:
  # The database is versioned separately from the tool and fetched with `amrfinder -u`; both
  # versions go into provenance, because an ARG call depends on its database version.
  - ncbi-amrfinderplus >=4.0
  - hamronization >=1.1
  - argnorm >=0.6
