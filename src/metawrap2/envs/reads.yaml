# Everything that touches reads: QC, assembly, re-assembly, and the blob plot.
#
# One env rather than four. read_qc, assembly, reassemble_bins and blobology run the same aligners
# and samtools, and SPAdes is shared by two of them, so splitting them up meant solving the same
# dependency graph four times and keeping four copies of it current. They also run in sequence in a
# normal study, so there is no case where you want one and not the others.
#
# python <3.12 is QUAST's constraint, not a choice: QUAST 5.x still imports distutils, which 3.12
# removed from the stdlib, so an unpinned solve produces an env where `quast` dies on import.
#
# All three aligners ship so that --aligner needs no second install. bwa is the assembly module's
# default, where the registry's minimap2 is binning's: that choice was made on depth agreement,
# which is not what the hybrid path reads out of an alignment.
name: metawrap2-reads
channels:
  - conda-forge
  - bioconda
dependencies:
  - python <3.12
  - trim-galore >=0.6.10
  - fastp >=0.24.0
  - fastqc >=0.12.1
  - bmtagger >=3.101
  - bowtie2 >=2.5
  - spades >=3.15
  - megahit >=1.2.9
  - quast >=5.2.0
  - blast >=2.13
  - bwa >=0.7.17
  - bwa-mem2 >=2.2
  - minimap2 >=2.24
  - samtools >=1.15
  # Diversity coverage (`metawrap2 nonpareil`). It is here rather than in its own env because it
  # reads a read file and nothing else, like the rest of this env, and because one more install
  # command is a worse trade than the ~300 MB of r-base that bioconda's build pulls in: the
  # package is built against R, which ships its model-fitting code. MetaWrap2 does not use that
  # R code - metawrap2.nonpareil fits the model in Python - but the R package is a useful
  # cross-check and the test suite's expected values came from it.
  - nonpareil >=3.5.4
  # metaFlye, for `assembly --long-reads`. Here rather than in its own environment because this is
  # where `assembly` runs: a long-read assembly should not need a second install command, and Flye
  # solves into this set without moving anything (it takes the py311 build the quast pin already
  # forces). Racon is not here - see the note on polishing in metawrap2.longreads.
  - flye >=2.9
