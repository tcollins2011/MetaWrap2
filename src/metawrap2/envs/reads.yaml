# Everything that touches reads: QC, assembly, re-assembly, and the blob plot.
#
# One env instead of four. read_qc, assembly, reassemble_bins and blobology use the same aligners
# and samtools, SPAdes is shared by two of them, and in a normal study they run in sequence.
#
# python <3.12 is QUAST's constraint: QUAST 5.x imports distutils, which 3.12 removed from the
# stdlib, so an unpinned solve gives an env where `quast` fails on import.
#
# All three aligners ship so that --aligner needs no second install. bwa is the assembly module's
# default while minimap2 is binning's: binning's choice was made on depth agreement, which is not
# what the hybrid path reads from an alignment.
name: metawrap2-reads
channels:
  - conda-forge
  - bioconda
dependencies:
  - python <3.12
  - trim-galore >=0.6.10
  - fastp >=0.24.0
  # Capped below 0.13: FastQC 0.13.0 rewrote its CLI in argparse and dropped short flags, so an
  # unbounded solve gave new users a `read_qc` that failed on its first command. The lockfile holds
  # 0.12.1, so `install-env --from-lock` kept working but the default path (used by `quickstart`)
  # did not. Lift the cap after checking read_qc's FASTQC template against 0.13's flags.
  - fastqc >=0.12.1,<0.13
  - bmtagger >=3.101
  - bowtie2 >=2.5
  - spades >=3.15
  - megahit >=1.2.9
  - quast >=5.2.0
  - blast >=2.13
  - bwa >=0.7.17
  - bwa-mem2 >=2.2
  - minimap2 >=2.24
  - samtools >=1.15
  # Diversity coverage (`metawrap2 nonpareil`). Here because it reads only a read file, like the
  # rest of this env. Bioconda's build pulls in ~300 MB of r-base, since the package ships R
  # model-fitting code. MetaWrap2 fits the model in Python (metawrap2.nonpareil); the R package is a
  # cross-check, and the test suite's expected values came from it.
  - nonpareil >=3.5.4
  # metaFlye, for `assembly --long-reads`. Here because this is where `assembly` runs, and Flye
  # solves into this set without changing it (it takes the py311 build the quast pin already
  # forces). Racon is not here; see the note on polishing in metawrap2.longreads.
  - flye >=2.9
