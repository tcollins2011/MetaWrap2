# CheckM2, alone, because it cannot be solved with anything else here.
#
# CheckM2 and the CheckM1/GUNC/DAS Tool set have no common solution (checked against conda-forge
# + bioconda), so the solver forces this split. CheckM2 is also the faster scorer and the one every
# benchmark in this repo uses.
name: metawrap2-checkm2
channels:
  - conda-forge
  - bioconda
dependencies:
  # >=1.1.0, not >=1.0.2: in 1.0.2 and earlier a genome's score depends on the other genomes in the
  # batch. Every quality number this pipeline reports comes from here.
  - checkm2 >=1.1.0
